<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marathon Mitra</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

    <header class="flex justify-between items-center sticky border-1 border-[#ccc] p-[15px] shadow-lg">
        <figure class="">
            <img width="200px" src="img/image.webp" alt="">
        </figure>
        <nav>
            <ul class="flex gap-10">
                <a href="">
                    <li
                        class="flex items-center gap-3 text-lg font-normal rounded-md bg-red-400 px-3 py-2 text-red-100">
                        <i class="fa-solid fa-house"></i>Home
                    </li>
                </a>
                <a href="">
                    <li class="flex items-center gap-3 text-lg font-normal px-3 py-2  ">
                        <i class="fa-regular fa-calendar"></i>Events
                    </li>
                </a>
                <a href="">
                    <li class="flex items-center gap-3 text-lg font-normal px-3 py-2  ">
                        <i class="fa-solid fa-trophy"></i>Challanges
                    </li>
                </a>
                <a href="">
                    <li class="flex items-center gap-3 text-lg font-normal px-3 py-2 ">
                        <i class="fa-solid fa-location-dot"></i>Cities
                    </li>
                </a>
                <a href="">
                    <li class="flex items-center gap-3 text-lg font-normal px-3 py-2">
                        <i class="fa-solid fa-book-open"></i>Stories
                    </li>
                </a>
            </ul>

        </nav>
        <div>

            <button class="m-2">
                Login
            </button>
            <button class="m-2">
                SiginUp
            </button>
        </div>
    </header>

    <section class="md:w-full md:bg-red-500 m-auto flex justify-center items-center">
        <div class="">
            <div class="mt-20 text-center text-white text-4xl font-large font-bold font-bebas
            tracking-wide">
                Discover Marathons, Running Events & <br />
                Stories Across India
            </div>

            <div class="mt-8  flex w-full items-center gap-2  bg-white p-2
            rounded-full  shadow-lg">
                <i class="fa-solid fa-magnifying-glass pl-3 text-white-400"></i>

                <input type="text" placeholder="Search events, stories, cities, or reaces..."
                    class=" flex-1 px-3 py-3 bg-white px-3 py-3 text-gray-800 placeholder:text-gray-400 outline-none" />

                <button class="rounded-full bg-red-600 px-3 py-3 font-semibold text-white
                    transition hover:bg-red-400 hover:text-white-400 cursor-pointer">
                    Search
                </button>
            </div>
            <div class=" flex m-auto text-center  justify-center items-center my-6">
                <button class=" border-1 border-white bg-white px-3 py-3 rounded-lg
                text-red-400 mx-2">
                    <i class="fa-solid fa-location-dot"></i>FIND EVENTS NEAR ME</button>
                <button class=" border-1 border-white bg-red px-3 py-3 rounded-lg
                text-white mx-2"><i class="fa-solid fa-book-open"></i>READ RUNNER STORIES</button>
            </div>
        </div>
    </section>

    <section class="w-full flex m-[20px_auto] justify-center bg-white shadow-lg p-3">
        <div class="w-[1240px] flex m-auto justify-center text-center">
            <ul class="flex text-center gap-10">
                <li>
                    <i class="fa-regular fa-calendar inline-block [transform:scaleY(1.5)] text-red-400"></i> 
                    <span class="text-lg font-bold inline-block [transform:scaleY(1.5)]">233+</span> 
                    <p class="m-1">Upcoming Events </p>
                </li>
                <li>
                    <i class="fa-regular fa-circle-check inline-block [transform:scaleY(1.5)] text-blue-400"></i> <span class="text-lg font-bold inline-block [transform:scaleY(1.5)]">359+</span>
                    <p class="m-1">Completed Events</p>
                </li>
                <li>
                    <i class="fa-solid fa-book-open inline-block [transform:scaleY(1.5)] text-green-400"></i> <span class="text-lg font-bold inline-block [transform:scaleY(1.5)]">125+</span> 
                    <p class="m-1">Stories</p>
                </li>
                <li>
                  <i class="fa-solid fa-location-dot inline-block [transform:scaleY(1.5)] text-blue-400"></i>  <span class="text-lg font-bold inline-block [transform:scaleY(1.5)]">611+</span>
                    <p class="m-1">Cities</p>
                </li>
                <li>
                    <i class="fa-solid fa-shield-halved inline-block [transform:scaleY(1.5)] text-green-400" ></i> <span  class="text-lg font-bold inline-block [transform:scaleY(1.5)]">Listings</span>
                    <p class="m-1">Featured Events</p>
                </li>
            </ul>
        </div>
    </section>

    <section class="max-w-full mt-20">
        <div>
            <h2>Featured Events</h2>
        </div>
    </section>
</body>


</html>
