<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

    <header class="w-full top-0 z-10 items-center sticky border-1 border-[#ccc] px-5
    py-3 shadow-lg bg-white">
        <div class="flex justify-between items-center">
            <figure class="">
                <img width="200px" src="img/image.webp" alt="">
            </figure>
            <nav class="hidden lg:block">
                <ul class="flex gap-8">
                    <a href="index.html">
                        <li class="flex  items-center gap-3 text-lg font-normal px-3 py-2 hover:text-red-500">
                            <i class="fa-solid fa-house"></i>Home
                        </li>
                    </a>
                    <a href="">
                        <li class="flex items-center gap-3 text-lg font-normal px-3 py-2  hover:text-red-500 ">
                            <i class="fa-regular fa-calendar"></i>Events
                        </li>
                    </a>
                    <a href="">
                        <li class="flex items-center gap-3 text-lg font-normal px-3 py-2 rounded-lg text-red-500 bg-red-100">
                            <i class="fa-solid fa-trophy"></i>Challanges
                        </li>
                    </a>
                    <a href="">
                        <li class="flex items-center gap-3 text-lg font-normal px-3 py-2  hover:text-red-500">
                            <i class="fa-solid fa-location-dot"></i>Cities
                        </li>
                    </a>
                    <a href="">
                        <li class="flex items-center gap-3 text-lg font-normal px-3 py-2 hover:text-red-500">
                            <i class="fa-solid fa-book-open"></i>Stories
                        </li>
                    </a>
                </ul>

            </nav>

            <div class="hidden lg:flex items-center gap-3">
                <button class="m-2 cursor-pointer">
                    Login
                </button>
                <button class="m-2 cursor-pointer bg-red-500 text-white px-3 py-2 rounded-md 
            hover:bg-red-400">
                    Sigin Up
                </button>
            </div>

            <details class="relative lg:hidden">
                <summary class="cursor-pointer text-2xl p-2">

                    <i class="fa-solid fa-bars"></i>

                </summary>

                <div id
                    class="absolute right-0 top-full mt-3 w-64 bg-white shadow-xl border border-gray-300 rounded-lg p-5">
                    <ul class="flex flex-col gap-4">

                        <a href="index.html">
                            <li class="flex items-center gap-3 hover:text-red-500">
                                Home
                            </li>
                        </a>
                        <a href="events.html">
                            <li class="flex items-center gap-3 hover:text-red-500">Events</li>
                        </a>
                        <a href="">
                            <li class="flex items-center gap-3 hover:text-red-500">Challanges</li>
                        </a>
                        <a href="">
                            <li class="flex items-center gap-3 hover:text-red-500">Cities</li>
                        </a>
                        <a href="">
                            <li class="flex items-center gap-3 hover:text-red-500">Stories</li>
                        </a>
                    </ul>

                    <div class="flex flex-col gap-3 mt-2">
                        <button class="bg-red-600 rounded-lg px-3 py-3 text-white hover:bg-red-700">
                            Login
                        </button>
                        <button class="bg-red-600 rounded-lg px-3 py-3 text-white  hover:bg-red-400">
                            Sign Up
                        </button>
                    </div>

                </div>
            </details>
        </div>
    </header>

    <section class="bg-purple-700">
        <div class="text-white   px-4 py-16">
            <h1 class="font-bold text-4xl font-bebas [transform:scaleY(1.5)] tracking-[0.1em]">
                VIRTUAL CHALLANGES
            </h1>
            <h2 class=" mt-6 text-xl">
                Join virtual running challenges from anywhere, anytime
            </h2>
        </div>
    </section>

    <section class="bg-gray-200 w-full px-3 py-10">

        <div class="w-1240px bg-white px-3 py-4 rounded-lg m-auto">
            <div class=" my flex items-center gap-3">
                <i class="fa-solid fa-filter text-red-400"></i>
                <h2 class="font-bold [transform:scaleY(1.2)]">FILTER CHALLANGES</h2>
            </div>

            <div class="grid grid-cols-4 gap-3 mt-4">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" placeholder="Search events"
                        class="border-gray-200 w-full border px-3 pl-9 py-2 rounded-lg">
                </div>

                <div class="relative ">
                    <i class="fa-regular fa-calendar absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" placeholder="All Events"
                        class="border-gray-200 w-full border px-3 py-2 rounded-lg pl-9">
                </div>


                <div class="relative">
                    <i class="fa-solid fa-location-dot absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" placeholder="Cities" 
                    class="border-gray-200 border w-full px-3 pl-9 py-2 rounded-lg">
                </div>

                <div class="relative">
                    <i class="fa-solid fa-ruler absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" placeholder="Distance"
                        class="border-gray-200 w-full border px-3 pl-9 py-2 rounded-lg">
                </div>
               
            </div>

            <div class="border border-gray-200 gap-5 my-6"></div>

            <div class="flex  items-center gap-2">
                <p>Active filters:</p> <span class="rounded-full bg-purple-100 px-3 py-1">All</span>
            </div>

        </div>
    </section>

</body>

</html>
